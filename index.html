<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музика на GitHub Pages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .player-container {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            margin: 0 auto;
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        .status {
            margin: 15px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1>🎵 Музична пауза, танцюють ВСІ !!!</h1>
        <p class="status" id="status">Завантаження...</p>
        
        <audio id="audioPlayer" controls loop>
            <source src="audio.mp3" type="audio/mpeg">
            Ваш браузер не підтримує аудіо елементи
        </audio>
        
        <p>Музика запуститься автоматично після завантаження</p>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const status = document.getElementById('status');
        
        // Події аудіо
        audio.addEventListener('loadeddata', function() {
            status.textContent = '✅ Файл завантажено! Запуск...';
            attemptPlay();
        });
        
        audio.addEventListener('play', function() {
            status.textContent = '🎶 Зараз грає...';
            status.style.color = '#4CAF50';
        });
        
        audio.addEventListener('error', function() {
            status.textContent = '❌ Помилка завантаження файлу';
            status.style.color = '#f44336';
        });
        
        // Функція відтворення
        function attemptPlay() {
            audio.play().then(() => {
                console.log('Автовідтворення успішне!');
            }).catch(error => {
                status.innerHTML = '🔇 Браузер заблокував автозапуск. <br><small>Клікни на кнопку play вище</small>';
            });
        }
        
        // Запуск при кліку по сторінці
        document.body.addEventListener('click', function() {
            audio.play().catch(e => console.log('Потрібне ручне відтворення'));
        });
        
        // Автозапуск через 2 секунди
        setTimeout(attemptPlay, 2000);
    </script>
</body>
</html>
