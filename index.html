<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Музыка на GitHub Pages</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            min-height: 100vh;
            margin: 0;
        }
        .player-container {
            background: rgba(255,255,255,0.1);
            padding: 30px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
            max-width: 500px;
            margin: 0 auto;
        }
        audio {
            width: 100%;
            margin: 20px 0;
        }
        .status {
            margin: 15px 0;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="player-container">
        <h1>🎵 Музыкальный плеер</h1>
        <p class="status" id="status">Загрузка...</p>
        
        <audio id="audioPlayer" controls loop>
            <source src="audio.mp3" type="audio/mpeg">
            Ваш браузер не поддерживает аудио элементы
        </audio>
        
        <p>Музыка запустится автоматически после загрузки</p>
    </div>

    <script>
        const audio = document.getElementById('audioPlayer');
        const status = document.getElementById('status');
        
        // События аудио
        audio.addEventListener('loadeddata', function() {
            status.textContent = '✅ Файл загружен! Запуск...';
            attemptPlay();
        });
        
        audio.addEventListener('play', function() {
            status.textContent = '🎶 Сейчас играет...';
            status.style.color = '#4CAF50';
        });
        
        audio.addEventListener('error', function() {
            status.textContent = '❌ Ошибка загрузки файла';
            status.style.color = '#f44336';
        });
        
        // Функция воспроизведения
        function attemptPlay() {
            audio.play().then(() => {
                console.log('Автовоспроизведение успешно!');
            }).catch(error => {
                status.innerHTML = '🔇 Браузер заблокировал автозапуск. <br><small>Кликни на кнопку play выше</small>';
            });
        }
        
        // Запуск при клике по странице
        document.body.addEventListener('click', function() {
            audio.play().catch(e => console.log('Нужно ручное воспроизведение'));
        });
        
        // Автозапуск через 2 секунды
        setTimeout(attemptPlay, 2000);
    </script>
</body>
</html>
